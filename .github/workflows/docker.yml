name: Publish CUDA 12.3.2 Docker image

# This workflow only runs when started manually from the Actions page.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag"
        required: true
        type: string
        default: "v1.0.0"

permissions:
  contents: read

concurrency:
  group: publish-cuda12-3-2-docker-image
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: hifun0916/llama.cpp
  CUDA_VERSION: 12.3.2

jobs:
  build-and-push:
    name: Build and push CUDA 12.3.2 server image
    runs-on: ubuntu-26.04

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate version
        shell: bash
        env:
          IMAGE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker tag: $IMAGE_VERSION"
            exit 1
          fi

      - name: Get build date
        id: build-date
        shell: bash
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

      - name: Log in to Docker Hub
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: .devops/cuda.Dockerfile
          target: server
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:server-cuda12.3.2-${{ inputs.version }}
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            UBUNTU_VERSION=22.04
            GCC_VERSION=12
            BUILD_DATE=${{ steps.build-date.outputs.value }}
            APP_VERSION=${{ inputs.version }}
            APP_REVISION=${{ github.sha }}
            IMAGE_URL=${{ github.server_url }}/${{ github.repository }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.created=${{ steps.build-date.outputs.value }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=llama.cpp
            org.opencontainers.image.description=LLM inference in C/C++
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
